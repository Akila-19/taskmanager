apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.2.0 # Use a specific version
        ports:
        - containerPort: 3000
        # env:
        # - name: GF_SECURITY_ADMIN_USER
        #   value: admin
        # - name: GF_SECURITY_ADMIN_PASSWORD
        #   value: promadmin # Use a simple password for the lab