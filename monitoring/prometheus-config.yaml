apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'taskmanager-app'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['default'] 
        relabel_configs:
          # 1. Keep only targets associated with the 'taskmanager-app' service name
          - source_labels: [__meta_kubernetes_service_name]
            regex: taskmanager-app
            action: keep
            
          # 2. Keep only the target port we want to scrape (e.g., the port named 'http-metrics' or similar)
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http-metrics
            action: keep
            
          # 3. Explicitly set the path to /metrics
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            regex: (.*)
            target_label: __metrics_path__
            replacement: /metrics
