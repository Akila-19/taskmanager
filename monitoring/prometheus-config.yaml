# prometheus-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'taskmanager-app'
        static_configs:
          - targets: ['taskmanager-service.taskmanager.svc.cluster.local:3000'] 
