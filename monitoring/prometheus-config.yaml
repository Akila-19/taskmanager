    apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring # Assuming 'monitoring' is your Prometheus namespace
data:
  # The entire prometheus.yml content is indented 
  # by two spaces relative to the 'prometheus.yml: |' key.
  prometheus.yml: |
    global:
      # The interval at which targets are scraped
      scrape_interval: 15s
      # The interval at which rules (alerts, recordings) are evaluated
      evaluation_interval: 15s

    scrape_configs:
      # 1. Prometheus Server Self-Scrape
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # 2. Application Scrape Job (taskmanager)
      - job_name: 'taskmanager-app'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              # Targets the specific namespace
              names: ['taskmanager']
              
        relabel_configs:
          # Filter 1: Keep only endpoints linked to the Service named 'taskmanager-service'
          - source_labels: [__meta_kubernetes_service_name]
            regex: taskmanager-service
            action: keep
          
          # Rewrite Address: Change the port to the application's metrics port (3000)
          - source_labels: [__address__]
            regex: '(.+):(\d+)'
            replacement: '$1:3000'
            target_label: '__address__'
            action: replace

          # Labeling 1: Set 'kubernetes_namespace' label
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
            action: replace
            
          # Labeling 2: Use the Pod Name as the 'instance' label
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
            action: replace
            
          # Labeling 3: Set the metrics path (based on pod annotation)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            regex: (.+)
            target_label: __metrics_path__
            action: replace
