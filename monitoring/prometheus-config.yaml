apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'taskmanager-app'
        kubernetes_sd_configs:
          - role: endpoints # FIX 1: Changed from 'pod' to 'endpoints'
            namespaces:
              names: ['taskmanager'] # FIX 2: Changed from 'default' to 'taskmanager'
        relabel_configs:
          # 1. Keep only targets associated with the 'taskmanager-app' service
          # This ensures we only scrape the correct application.
          - source_labels: [__meta_kubernetes_service_name]
            regex: taskmanager-service
            action: keep

          - source_labels: [__address__]
            regex: '(.+):(\d+)'
            replacement: '$1:3000'
            target_label: '__address__'
            action: 'replace'
            
          # 2. Add Namespace Label (This makes the 'kubernetes_namespace' label appear in Grafana)
          # We explicitly define the namespace label to be added to the metrics.
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
            action: replace

          # 3. Explicitly set the metrics path to /metrics
          # This ensures Prometheus knows where to find the application's metrics data.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            regex: (.*)
            target_label: __metrics_path__
            replacement: /metrics
